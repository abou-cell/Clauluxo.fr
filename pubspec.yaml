name: clauluxo_mobile
description: Application mobile ClauLuxo V1 - Centre de Luxopuncture Claudine Amerigo
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_svg: ^2.0.17
  url_launcher: ^6.3.2
  firebase_core: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/hero.svg
