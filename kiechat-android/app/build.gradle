plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.kie.kiechat'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.kie.kiechat'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
